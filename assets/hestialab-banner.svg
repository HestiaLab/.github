<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="HestiaLab">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05081c"/>
      <stop offset="40%" stop-color="#141432"/>
      <stop offset="75%" stop-color="#2a1e52"/>
      <stop offset="100%" stop-color="#3b2568"/>
    </linearGradient>
    <!-- 星云 -->
    <radialGradient id="nebulaPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8a5cff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#6a3fd0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6a3fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4aa8ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#2a6fd0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2a6fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd478" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#e8a04b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e8a04b" stop-opacity="0"/>
    </radialGradient>
    <!-- 银河带 -->
    <linearGradient id="milkyway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8a0ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#b8a0ff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#e0d0ff" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#b8a0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b8a0ff" stop-opacity="0"/>
    </linearGradient>
    <!-- 月亮光晕 -->
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ffd478" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ffd478" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffd478" stop-opacity="0"/>
    </radialGradient>
    <!-- 流星尾迹 -->
    <linearGradient id="shootingStar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- 夜空背景 -->
  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- 星云 -->
  <ellipse cx="300" cy="140" rx="300" ry="180" fill="url(#nebulaPurple)"/>
  <ellipse cx="820" cy="100" rx="320" ry="200" fill="url(#nebulaBlue)"/>
  <ellipse cx="620" cy="220" rx="240" ry="140" fill="url(#nebulaGold)"/>

  <!-- 银河带 -->
  <path d="M -60 320 C 240 250, 420 140, 700 90 C 920 52, 1080 40, 1260 60 L 1260 160 C 1080 130, 940 140, 720 180 C 460 228, 260 320, -60 400 Z" fill="url(#milkyway)"/>

  <!-- 大月亮 -->
  <circle cx="1010" cy="100" r="130" fill="url(#moonGlow)"/>
  <circle cx="1010" cy="100" r="46" fill="#fff4cf"/>
  <circle cx="1024" cy="88" r="42" fill="url(#sky)" opacity="0.9"/>
  <circle cx="1000" cy="100" r="3" fill="#e8d8a0" opacity="0.5"/>
  <circle cx="1018" cy="112" r="2" fill="#e8d8a0" opacity="0.4"/>

  <!-- 星空（大小星点） -->
  <g fill="#ffffff">
    <circle cx="70" cy="60" r="2.0" opacity="0.95"/>
    <circle cx="180" cy="34" r="1.2" opacity="0.6"/>
    <circle cx="320" cy="52" r="1.6" opacity="0.8"/>
    <circle cx="460" cy="28" r="1.1" opacity="0.55"/>
    <circle cx="560" cy="66" r="2.2" opacity="0.9"/>
    <circle cx="700" cy="40" r="1.4" opacity="0.7"/>
    <circle cx="860" cy="56" r="1.8" opacity="0.85"/>
    <circle cx="1140" cy="30" r="1.3" opacity="0.65"/>
    <circle cx="120" cy="120" r="1.0" opacity="0.5"/>
    <circle cx="400" cy="100" r="1.3" opacity="0.6"/>
    <circle cx="640" cy="118" r="1.0" opacity="0.5"/>
    <circle cx="940" cy="180" r="1.4" opacity="0.7"/>
    <circle cx="1080" cy="200" r="1.1" opacity="0.55"/>
    <circle cx="520" cy="150" r="1.6" opacity="0.75"/>
    <circle cx="780" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="200" cy="200" r="1.1" opacity="0.5"/>
    <circle cx="340" cy="240" r="1.3" opacity="0.6"/>
  </g>

  <!-- 亮星（十字闪光） -->
  <g fill="#fff8e8">
    <circle cx="560" cy="66" r="1.2"/>
    <circle cx="320" cy="52" r="1.0"/>
    <circle cx="860" cy="56" r="1.0"/>
    <circle cx="180" cy="34" r="0.8"/>
  </g>

  <!-- 流星 -->
  <g>
    <line x1="80" y1="40" x2="170" y2="130" stroke="url(#shootingStar)" stroke-width="2" opacity="0.9"/>
    <circle cx="170" cy="130" r="2.2" fill="#ffffff" opacity="0.95"/>
    <line x1="480" y1="30" x2="560" y2="110" stroke="url(#shootingStar)" stroke-width="1.6" opacity="0.7"/>
    <circle cx="560" cy="110" r="1.8" fill="#ffffff" opacity="0.85"/>
    <line x1="760" y1="20" x2="820" y2="80" stroke="url(#shootingStar)" stroke-width="1.4" opacity="0.6"/>
    <circle cx="820" cy="80" r="1.5" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- 漂浮魔法光点 -->
  <g fill="#ffd478">
    <circle cx="620" cy="200" r="2.4" opacity="0.85"/>
    <circle cx="690" cy="250" r="1.6" opacity="0.6"/>
    <circle cx="540" cy="240" r="1.4" opacity="0.55"/>
    <circle cx="880" cy="230" r="1.8" opacity="0.7"/>
    <circle cx="960" cy="270" r="1.4" opacity="0.55"/>
    <circle cx="740" cy="160" r="1.3" opacity="0.6"/>
  </g>
  <g fill="#b8a0ff">
    <circle cx="580" cy="170" r="1.6" opacity="0.65"/>
    <circle cx="720" cy="220" r="1.2" opacity="0.5"/>
    <circle cx="820" cy="200" r="1.7" opacity="0.65"/>
    <circle cx="1000" cy="240" r="1.3" opacity="0.5"/>
  </g>

  <!-- 底部山峦剪影 -->
  <g fill="#070512">
    <path d="M 0 400 L 0 352
             C 50 332, 110 346, 170 338
             C 230 330, 290 348, 350 342
             C 410 336, 470 350, 530 344
             C 590 338, 650 352, 710 346
             C 770 340, 830 354, 890 348
             C 950 342, 1010 356, 1070 350
             C 1130 344, 1160 350, 1200 346
             L 1200 400 Z"/>
  </g>

  <!-- 标题 -->
  <text x="600" y="250" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="72" letter-spacing="8" fill="#f0cf7c" font-weight="bold">HestiaLab</text>
</svg>
