<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="HestiaLab">
  <defs>
    <!-- 黎明天空：深邃苍穹 → 暖金地平线 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1440"/>
      <stop offset="35%" stop-color="#4a2a6a"/>
      <stop offset="62%" stop-color="#8a4a7a"/>
      <stop offset="82%" stop-color="#e88a6a"/>
      <stop offset="100%" stop-color="#f5c080"/>
    </linearGradient>
    <!-- 极光（青绿） -->
    <linearGradient id="auroraGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fe0c8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4fe0c8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4fe0c8" stop-opacity="0"/>
    </linearGradient>
    <!-- 极光（紫） -->
    <linearGradient id="auroraPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b06ae0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b06ae0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b06ae0" stop-opacity="0"/>
    </linearGradient>
    <!-- 魔法光源 -->
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="1"/>
      <stop offset="25%" stop-color="#ffd478" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ffb060" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb060" stop-opacity="0"/>
    </radialGradient>
    <!-- 放射光束 -->
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2c0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff2c0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 黎明天空 -->
  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- 极光（青绿，横跨顶部） -->
  <path d="M -50 120 C 120 40, 300 160, 480 90 C 660 20, 840 150, 1020 80 C 1120 45, 1180 60, 1250 70 L 1250 190 C 1150 170, 1080 150, 980 180 C 800 230, 620 110, 460 190 C 300 260, 120 160, -50 220 Z" fill="url(#auroraGreen)" opacity="0.55"/>
  <path d="M -50 90 C 160 30, 360 140, 560 70 C 760 0, 960 120, 1250 60 L 1250 130 C 1000 170, 780 70, 580 150 C 380 220, 180 120, -50 170 Z" fill="url(#auroraPurple)" opacity="0.5"/>

  <!-- 魔法光源（地平线上升起的金色天体） -->
  <circle cx="700" cy="250" r="210" fill="url(#sun)"/>
  <circle cx="700" cy="250" r="72" fill="#fff4cf"/>

  <!-- 放射光束 -->
  <g opacity="0.6">
    <polygon points="700,250 520,40 560,40" fill="url(#ray)"/>
    <polygon points="700,250 860,40 900,40" fill="url(#ray)"/>
    <polygon points="700,250 400,120 440,120" fill="url(#ray)"/>
    <polygon points="700,250 960,130 1000,130" fill="url(#ray)"/>
    <polygon points="700,250 700,0 720,0" fill="url(#ray)"/>
  </g>

  <!-- 浮空岛屿（远近对比形成纵深） -->
  <g>
    <!-- 远景小岛 -->
    <path d="M 180 150 C 190 140, 210 138, 222 146 L 216 162 L 186 160 Z" fill="#2a1a4a" opacity="0.75"/>
    <path d="M 940 130 C 950 120, 970 118, 982 126 L 976 142 L 946 140 Z" fill="#2a1a4a" opacity="0.7"/>
    <!-- 近景大岛（左） -->
    <path d="M 120 260 L 300 240 L 340 268 L 320 300 L 150 310 Z" fill="#1a1030"/>
    <path d="M 120 260 L 220 250 L 300 240 L 250 262 L 170 272 Z" fill="#2a1a4a" opacity="0.9"/>
    <!-- 近景大岛（右） -->
    <path d="M 980 230 L 1150 218 L 1190 248 L 1160 282 L 1000 290 Z" fill="#1a1030"/>
    <path d="M 980 230 L 1080 224 L 1150 218 L 1100 240 L 1020 250 Z" fill="#2a1a4a" opacity="0.9"/>
  </g>

  <!-- 浮空岛上的发光建筑/水晶 -->
  <g fill="#ffd478">
    <polygon points="215,248 222,232 229,248" opacity="0.9"/>
    <polygon points="1080,222 1088,204 1096,222" opacity="0.9"/>
  </g>

  <!-- 星点（晨星尚存） -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="260" cy="42" r="1.2" opacity="0.6"/>
    <circle cx="420" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="560" cy="50" r="1.1" opacity="0.5"/>
    <circle cx="820" cy="48" r="1.4" opacity="0.6"/>
    <circle cx="1080" cy="66" r="1.6" opacity="0.8"/>
    <circle cx="1150" cy="40" r="1.1" opacity="0.5"/>
    <circle cx="160" cy="30" r="1.0" opacity="0.5"/>
  </g>

  <!-- 云海（金色镶边的层叠云） -->
  <g>
    <path d="M 0 340 C 120 320, 240 350, 360 336 C 480 322, 600 350, 720 338 C 840 326, 960 352, 1080 340 C 1140 334, 1180 340, 1200 336 L 1200 400 L 0 400 Z" fill="#3a2058" opacity="0.85"/>
    <path d="M 0 360 C 140 344, 280 368, 420 356 C 560 344, 700 370, 840 358 C 980 346, 1100 368, 1200 358 L 1200 400 L 0 400 Z" fill="#241440"/>
    <path d="M 0 378 C 160 366, 320 384, 480 376 C 640 368, 800 386, 960 378 C 1080 372, 1150 378, 1200 376 L 1200 400 L 0 400 Z" fill="#140a28"/>
  </g>

  <!-- 云海顶部金色边光 -->
  <path d="M 0 340 C 120 320, 240 350, 360 336 C 480 322, 600 350, 720 338 C 840 326, 960 352, 1080 340 C 1140 334, 1180 340, 1200 336" fill="none" stroke="#ffc880" stroke-width="1.6" opacity="0.6"/>

  <!-- 标题 -->
  <text x="600" y="285" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="74" letter-spacing="9" fill="#ffe6b0" font-weight="bold">HestiaLab</text>
</svg>
