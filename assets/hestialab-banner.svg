<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="HestiaLab — the hearth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="45%" stop-color="#110d11"/>
      <stop offset="100%" stop-color="#1b110e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb35c" stop-opacity="0.46"/>
      <stop offset="34%" stop-color="#ff7a2f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0708"/>
      <stop offset="45%" stop-color="#391306"/>
      <stop offset="100%" stop-color="#8c3206"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2d31"/>
      <stop offset="55%" stop-color="#241a1e"/>
      <stop offset="100%" stop-color="#0f0a0d"/>
    </linearGradient>
    <linearGradient id="curb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3630"/>
      <stop offset="100%" stop-color="#150f11"/>
    </linearGradient>
    <radialGradient id="floorlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffa64d" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd08a" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#ff8a2a" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.72">
      <stop offset="46%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.64"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <ellipse cx="600" cy="262" rx="470" ry="262" fill="url(#halo)"/>

  <!-- floor -->
  <rect x="0" y="338" width="1200" height="62" fill="#0c080a"/>
  <path d="M0 338 C 200 334, 400 342, 600 339 C 800 336, 1000 344, 1200 340 L 1200 344 L 0 344 Z" fill="#251a1b" opacity="0.85"/>
  <ellipse cx="600" cy="350" rx="300" ry="22" fill="url(#floorlight)"/>

  <!-- hearth niche -->
  <path d="M 450 338 L 450 250 A 150 150 0 0 1 750 250 L 750 338 Z" fill="url(#mouth)"/>
  <path d="M 418 338 L 418 250 A 182 182 0 0 1 782 250 L 782 338" fill="none" stroke="url(#stone)" stroke-width="34" stroke-linejoin="round"/>
  <path d="M 466 338 L 466 250 A 134 134 0 0 1 734 250 L 734 338" fill="none" stroke="#ff9a4d" stroke-width="1.8" opacity="0.32"/>

  <!-- stone seams -->
  <g stroke="#08050a" stroke-width="1.4" opacity="0.5">
    <path d="M 466 250 L 434 250"/>
    <path d="M 502 162 L 478 141"/>
    <path d="M 556 118 L 545 86"/>
    <path d="M 644 118 L 655 86"/>
    <path d="M 698 162 L 722 141"/>
    <path d="M 734 250 L 766 250"/>
    <path d="M 418 270 L 450 270"/>
    <path d="M 418 300 L 450 300"/>
    <path d="M 418 326 L 450 326"/>
    <path d="M 750 270 L 782 270"/>
    <path d="M 750 300 L 782 300"/>
    <path d="M 750 326 L 782 326"/>
  </g>

  <!-- fire light -->
  <ellipse cx="600" cy="268" rx="168" ry="146" fill="url(#fireglow)"/>

  <!-- flames -->
  <g>
    <path d="M 592 118 C 620 170 664 200 666 242 C 670 292 638 340 600 340 C 562 340 534 292 538 242 C 540 200 566 170 592 118 Z" fill="#bf3f16" opacity="0.4"/>
    <path d="M 600 168 C 618 204 646 228 647 258 C 649 294 626 326 600 326 C 574 326 551 294 553 258 C 554 228 582 204 600 168 Z" fill="#ff7a18" opacity="0.82"/>
    <path d="M 600 214 C 611 240 626 256 626 274 C 626 298 614 314 600 314 C 586 314 574 298 574 274 C 574 256 589 240 600 214 Z" fill="#ffc24d" opacity="0.96"/>
    <path d="M 600 254 C 606 268 613 276 613 288 C 613 302 607 309 600 309 C 593 309 587 302 587 288 C 587 276 594 268 600 254 Z" fill="#fff8e2"/>
    <path d="M 552 336 C 542 302 552 274 566 260 C 559 292 564 316 578 336 Z" fill="#ff8a2a" opacity="0.5"/>
    <path d="M 648 336 C 658 300 648 272 634 258 C 641 292 636 316 622 336 Z" fill="#ff8a2a" opacity="0.5"/>
    <path d="M 678 332 C 686 306 678 286 668 274 C 666 296 668 314 662 332 Z" fill="#ffab4d" opacity="0.3"/>
    <path d="M 522 332 C 514 306 522 288 532 276 C 534 298 532 314 538 332 Z" fill="#ffab4d" opacity="0.28"/>
  </g>

  <!-- logs -->
  <g stroke="#2b1310" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M 528 340 L 672 326"/>
    <path d="M 536 324 L 664 342"/>
  </g>
  <g stroke="#ff9a3d" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 548 338 L 616 329"/>
    <path d="M 580 326 L 648 338"/>
  </g>

  <!-- hearth curb -->
  <path d="M 404 338 L 796 338 L 788 352 L 412 352 Z" fill="url(#curb)"/>
  <path d="M 404 338 L 796 338" stroke="#ff9a4d" stroke-width="1.6" opacity="0.35"/>

  <!-- embers -->
  <g fill="#ffb35c">
    <circle cx="598" cy="96" r="2.3" opacity="0.68"/>
    <circle cx="576" cy="74" r="1.6" opacity="0.48"/>
    <circle cx="621" cy="58" r="1.9" opacity="0.52"/>
    <circle cx="558" cy="100" r="1.3" opacity="0.4"/>
    <circle cx="639" cy="92" r="1.4" opacity="0.42"/>
    <circle cx="589" cy="38" r="1.1" opacity="0.3"/>
    <circle cx="622" cy="26" r="0.9" opacity="0.24"/>
    <circle cx="662" cy="68" r="1.1" opacity="0.26"/>
    <circle cx="536" cy="74" r="1.0" opacity="0.24"/>
  </g>
  <g fill="#ff8a3d">
    <circle cx="607" cy="46" r="1.1" opacity="0.32"/>
    <circle cx="549" cy="50" r="0.8" opacity="0.2"/>
    <circle cx="650" cy="40" r="0.8" opacity="0.2"/>
  </g>

  <!-- distant hearths -->
  <g fill="#ff9a4d">
    <circle cx="206" cy="246" r="2.6" opacity="0.18"/>
    <circle cx="994" cy="240" r="2.6" opacity="0.16"/>
  </g>

  <rect width="1200" height="400" fill="url(#vignette)"/>
</svg>